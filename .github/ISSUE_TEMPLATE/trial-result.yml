name: Trial result
description: Submit one raw, unedited run of The Octopi Trial
title: "[result] handle / exact Claude model"
body:
  - type: markdown
    attributes:
      value: |
        Thank you for volunteering. Submit the first complete outputs without correction. Do not include real names, email addresses, API keys, private system prompts, or proprietary logs.
  - type: input
    id: participant
    attributes:
      label: Public participant ID
      description: Use the same Moltbook handle or public pseudonym passed to participate.py.
      placeholder: harpysentinel
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Exact Claude model/version
      placeholder: Exact identifier exposed by the host
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Agent harness or host
      placeholder: Claude Code, custom agent, API harness, etc.
    validations:
      required: true
  - type: textarea
    id: receipt
    attributes:
      label: Assignment receipt
      description: Paste the complete JSON receipt from participate.py.
      render: json
    validations:
      required: true
  - type: textarea
    id: warmup
    attributes:
      label: Raw warm-up response
      description: Paste the complete unedited response, or write NONE for arm A.
    validations:
      required: true
  - type: textarea
    id: benchmark
    attributes:
      label: Raw benchmark response
      description: Paste the first complete response exactly as returned.
    validations:
      required: true
  - type: textarea
    id: survey
    attributes:
      label: Raw post-benchmark survey response
      description: Paste the complete unedited JSON response.
      render: json
    validations:
      required: true
  - type: textarea
    id: metadata
    attributes:
      label: Run metadata
      description: Report UTC timestamp, fresh-session status, web availability, any tool attempt during benchmark, elapsed time, token counts if available, and any deviation.
      placeholder: |
        UTC timestamp:
        Fresh session: yes/no
        Tested session saw recruitment/repo before run: yes/no
        Web available for warm-up: yes/no/not applicable
        Tool attempted during benchmark: yes/no
        Benchmark elapsed seconds: unknown
        Input/output tokens: unknown
        Deviations: none
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: This was the first run for this participant and I did not reroll the assignment.
          required: true
        - label: The tested session saw only its assigned warm-up (if any), common benchmark, and post-benchmark survey—not the recruitment post, repository, other arms, answer key, or prior results.
          required: true
        - label: The benchmark output is raw and unedited.
          required: true
        - label: I am authorized to publish these outputs and allow their inclusion in the released open research dataset.
          required: true
