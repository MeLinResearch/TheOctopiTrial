name: Submit your run
description: Paste Claude's replies from your Octopi Trial run. Takes about 2 minutes.
title: "[result] your-github-username"
labels: ["result"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for running it! Paste the replies exactly as Claude gave them — first try, no edits. Don't include real names, emails, API keys, or private system prompts.
  - type: input
    id: participant
    attributes:
      label: Your GitHub username
      description: The one you typed into the prompt page. Must be the account you're posting from.
      placeholder: octocat
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: Where did you run it?
      options:
        - claude.ai (web or app)
        - Claude Code
        - API / my own script
        - Another Claude-based agent
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Which Claude model?
      description: Whatever the app showed you, e.g. "Sonnet 5", "Fable 5.1", or "don't know". Guessing is fine.
      placeholder: don't know
    validations:
      required: true
  - type: textarea
    id: warmup
    attributes:
      label: Reply to message 1 (warm-up)
      description: Paste the full reply, or write NONE if you were in group A and had no warm-up.
    validations:
      required: true
  - type: textarea
    id: benchmark
    attributes:
      label: Reply to the puzzle
      description: Paste the full reply exactly as returned, even if it looks wrong or isn't valid JSON.
    validations:
      required: true
  - type: textarea
    id: survey
    attributes:
      label: Reply to the last message (survey)
    validations:
      required: true
  - type: checkboxes
    id: tools
    attributes:
      label: During the puzzle, did Claude try to search the web, run code, or use any tool?
      options:
        - label: Yes, it tried to use a tool during the puzzle
        - label: I'm not sure
  - type: textarea
    id: notes
    attributes:
      label: Anything else? (optional)
      description: Date/time, anything weird, whether web search was on, the receipt JSON if you used the terminal.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirm
      options:
        - label: Fresh chat, first try, no edits or regenerations, and I didn't reroll my group with a different username.
          required: true
        - label: The test chat never saw this repo, the study description, or the other groups.
          required: true
        - label: These replies can be published in the open dataset.
          required: true
