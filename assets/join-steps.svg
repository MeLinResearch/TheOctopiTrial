<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 452" width="800" height="452" role="img" aria-label="Step 1: get your prompts. Step 2: open a fresh Claude chat. Step 3: paste them one at a time. Step 4: send the replies back.">
<title>Step 1: get your prompts. Step 2: open a fresh Claude chat. Step 3: paste them one at a time. Step 4: send the replies back.</title>
<style>text{font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}</style>
<rect width="800" height="452" rx="16" fill="#140a2b"/><rect x="16" y="16" width="376" height="200" rx="14" fill="#21123f"/><rect x="16" y="16" width="6" height="200" rx="3" fill="#ff5fa2"/><rect x="44" y="44" width="48" height="48" rx="10" fill="#ff5fa2"/><text x="68" y="78" font-size="26" font-weight="800" fill="#140a2b" text-anchor="middle">1</text><text x="108" y="76" font-size="26" font-weight="700" fill="#f3eeff">Get your prompts</text><text x="46" y="142" font-size="22" fill="#c9b8ff">Enter your GitHub username.</text><text x="46" y="176" font-size="22" fill="#c9b8ff">You get 2–3 messages.</text><rect x="408" y="16" width="376" height="200" rx="14" fill="#21123f"/><rect x="408" y="16" width="6" height="200" rx="3" fill="#7df9ff"/><rect x="436" y="44" width="48" height="48" rx="10" fill="#7df9ff"/><text x="460" y="78" font-size="26" font-weight="800" fill="#140a2b" text-anchor="middle">2</text><text x="500" y="76" font-size="26" font-weight="700" fill="#f3eeff">Open a fresh chat</text><text x="438" y="142" font-size="22" fill="#c9b8ff">Never seen this repo.</text><text x="438" y="176" font-size="22" fill="#c9b8ff">Any Claude plan works.</text><rect x="16" y="230" width="376" height="200" rx="14" fill="#21123f"/><rect x="16" y="230" width="6" height="200" rx="3" fill="#7df9ff"/><rect x="44" y="258" width="48" height="48" rx="10" fill="#7df9ff"/><text x="68" y="292" font-size="26" font-weight="800" fill="#140a2b" text-anchor="middle">3</text><text x="108" y="290" font-size="26" font-weight="700" fill="#f3eeff">Paste one at a time</text><text x="46" y="356" font-size="22" fill="#c9b8ff">Wait for each full reply.</text><text x="46" y="390" font-size="22" fill="#c9b8ff">No edits, no retries.</text><rect x="408" y="230" width="376" height="200" rx="14" fill="#21123f"/><rect x="408" y="230" width="6" height="200" rx="3" fill="#ff5fa2"/><rect x="436" y="258" width="48" height="48" rx="10" fill="#ff5fa2"/><text x="460" y="292" font-size="26" font-weight="800" fill="#140a2b" text-anchor="middle">4</text><text x="500" y="290" font-size="26" font-weight="700" fill="#f3eeff">Send replies back</text><text x="438" y="356" font-size="22" fill="#c9b8ff">Paste them into the form.</text><text x="438" y="390" font-size="22" fill="#c9b8ff">A bot tells you your group.</text></svg>