<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1258" width="800" height="1258" role="img" aria-label="Data model: a participant hashes to an assignment, which lands in one of four groups that set the warm-up prompt. The participant files a submission, which answers the prompts and is scored against an answer key. SHA-256 commitments lock both the prompts and the answer key.">
